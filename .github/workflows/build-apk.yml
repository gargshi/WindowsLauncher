name: Build OnePlus 15R Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Android SDK (API 34)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

      - name: Configure Home Launcher Manifest & Native Bridge
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()

          for perm in [
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.READ_CALL_LOG",
              "android.permission.READ_SMS",
          ]:
              if perm not in manifest:
                  manifest = manifest.replace(
                      "<application",
                      f'    <uses-permission android:name="{perm}" />\n\n    <application',
                      1,
                  )

          if "android.intent.category.HOME" not in manifest:
              manifest, count = re.subn(
                  r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                  r'\1\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />',
                  manifest,
                  count=1,
              )
              if count == 0:
                  raise RuntimeError("Could not find LAUNCHER category in AndroidManifest.xml")

          manifest_path.write_text(manifest)
          PY

          mkdir -p android/app/src/main/java/com/oxygentile/launcher

          cat <<'JAVA' > android/app/src/main/java/com/oxygentile/launcher/LauncherBridgePlugin.java
          package com.oxygentile.launcher;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.CallLog;
          import android.provider.Settings;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          @CapacitorPlugin(
              name = "LauncherBridge",
              permissions = {
                  @Permission(
                      alias = "communication",
                      strings = {
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_SMS
                      }
                  )
              }
          )
          public class LauncherBridgePlugin extends Plugin {
              private String encodeDrawable(Drawable drawable) {
                  try {
                      Bitmap bitmap = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(bitmap);
                      drawable.setBounds(0, 0, canvas.getWidth(), canvas.getHeight());
                      drawable.draw(canvas);
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      bitmap.compress(Bitmap.CompressFormat.PNG, 90, out);
                      return "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  PackageManager pm = getContext().getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> resolved = pm.queryIntentActivities(mainIntent, 0);
                  JSArray apps = new JSArray();
                  String selfPackage = getContext().getPackageName();

                  for (ResolveInfo info : resolved) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(selfPackage)) continue;
                      String label = info.loadLabel(pm).toString();
                      JSObject item = new JSObject();
                      item.put("name", label);
                      item.put("packageName", pkg);
                      String iconB64 = encodeDrawable(info.loadIcon(pm));
                      if (iconB64 != null) item.put("iconBase64", iconB64);
                      apps.put(item);
                  }

                  JSObject result = new JSObject();
                  result.put("apps", apps);
                  call.resolve(result);
              }

              @PluginMethod
              public void getCallingApps(PluginCall call) {
                  PackageManager pm = getContext().getPackageManager();
                  String selfPackage = getContext().getPackageName();
                  int flags = Build.VERSION.SDK_INT >= 23 ? PackageManager.MATCH_ALL : 0;

                  Map<String, JSObject> found = new LinkedHashMap<>();

                  Intent dialIntent = new Intent(Intent.ACTION_DIAL);
                  List<ResolveInfo> dialResolved = pm.queryIntentActivities(dialIntent, flags);
                  for (ResolveInfo info : dialResolved) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(selfPackage) || found.containsKey(pkg)) continue;
                      JSObject item = new JSObject();
                      item.put("name", info.loadLabel(pm).toString());
                      item.put("packageName", pkg);
                      String iconB64 = encodeDrawable(info.loadIcon(pm));
                      if (iconB64 != null) item.put("iconBase64", iconB64);
                      found.put(pkg, item);
                  }

                  Intent launcherIntent = new Intent(Intent.ACTION_MAIN, null);
                  launcherIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> launcherResolved = pm.queryIntentActivities(launcherIntent, 0);
                  for (ResolveInfo info : launcherResolved) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(selfPackage) || found.containsKey(pkg)) continue;
                      String lower = pkg.toLowerCase();
                      if (lower.contains("dialer") || lower.equals("com.truecaller")) {
                          JSObject item = new JSObject();
                          item.put("name", info.loadLabel(pm).toString());
                          item.put("packageName", pkg);
                          String iconB64 = encodeDrawable(info.loadIcon(pm));
                          if (iconB64 != null) item.put("iconBase64", iconB64);
                          found.put(pkg, item);
                      }
                  }

                  List<JSObject> ordered = new ArrayList<>();
                  if (found.containsKey("com.google.android.dialer")) {
                      ordered.add(found.remove("com.google.android.dialer"));
                  }
                  ordered.addAll(found.values());

                  JSArray apps = new JSArray();
                  for (JSObject obj : ordered) {
                      apps.put(obj);
                  }
                  JSObject result = new JSObject();
                  result.put("apps", apps);
                  call.resolve(result);
              }

              @PluginMethod
              public void ensureCommunicationPermissions(PluginCall call) {
                  boolean hasCallLog = getContext().checkSelfPermission(Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED;
                  boolean hasSms = getContext().checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED;
                  if (hasCallLog && hasSms) {
                      JSObject ret = new JSObject();
                      ret.put("hasCallLogPermission", true);
                      ret.put("hasSmsPermission", true);
                      call.resolve(ret);
                      return;
                  }
                  requestPermissionForAlias("communication", call, "communicationPermsCallback");
              }

              @PermissionCallback
              private void communicationPermsCallback(PluginCall call) {
                  boolean hasCallLog = getContext().checkSelfPermission(Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED;
                  boolean hasSms = getContext().checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED;
                  JSObject ret = new JSObject();
                  ret.put("hasCallLogPermission", hasCallLog);
                  ret.put("hasSmsPermission", hasSms);
                  call.resolve(ret);
              }

              @PluginMethod
              public void getCommunicationCounts(PluginCall call) {
                  boolean hasCallLog = getContext().checkSelfPermission(Manifest.permission.READ_CALL_LOG) == PackageManager.PERMISSION_GRANTED;
                  boolean hasSms = getContext().checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED;
                  int missedCalls = 0;
                  int unreadMessages = 0;

                  if (hasCallLog) {
                      Cursor cursor = null;
                      try {
                          cursor = getContext().getContentResolver().query(
                              CallLog.Calls.CONTENT_URI,
                              new String[] { CallLog.Calls._ID },
                              CallLog.Calls.TYPE + " = ? AND " + CallLog.Calls.NEW + " = 1 AND (" + CallLog.Calls.IS_READ + " = 0 OR " + CallLog.Calls.IS_READ + " IS NULL)",
                              new String[] { String.valueOf(CallLog.Calls.MISSED_TYPE) },
                              null
                          );
                          if (cursor != null) {
                              missedCalls = cursor.getCount();
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (cursor != null) cursor.close();
                      }
                  }

                  if (hasSms) {
                      Cursor smsCursor = null;
                      try {
                          smsCursor = getContext().getContentResolver().query(
                              Uri.parse("content://sms/inbox"),
                              new String[] { "_id" },
                              "read = 0",
                              null,
                              null
                          );
                          if (smsCursor != null) {
                              unreadMessages += smsCursor.getCount();
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (smsCursor != null) smsCursor.close();
                      }

                      Cursor mmsCursor = null;
                      try {
                          mmsCursor = getContext().getContentResolver().query(
                              Uri.parse("content://mms/inbox"),
                              new String[] { "_id" },
                              "read = 0 AND (m_type = 130 OR m_type = 132)",
                              null,
                              null
                          );
                          if (mmsCursor != null) {
                              unreadMessages += mmsCursor.getCount();
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (mmsCursor != null) mmsCursor.close();
                      }
                  }

                  JSObject result = new JSObject();
                  result.put("missedCalls", missedCalls);
                  result.put("unreadMessages", unreadMessages);
                  result.put("hasCallLogPermission", hasCallLog);
                  result.put("hasSmsPermission", hasSms);
                  call.resolve(result);
              }

              @PluginMethod
              public void launchApp(PluginCall call) {
                  String packageName = call.getString("packageName");
                  Boolean preferRecents = call.getBoolean("preferRecents", false);
                  if (packageName == null || packageName.isEmpty()) {
                      call.reject("Missing packageName");
                      return;
                  }
                  PackageManager pm = getContext().getPackageManager();
                  boolean isDialer = Boolean.TRUE.equals(preferRecents)
                      || "com.google.android.dialer".equals(packageName)
                      || "com.android.dialer".equals(packageName)
                      || packageName.toLowerCase().contains("dialer");

                  if (isDialer) {
                      try {
                          Intent recentsIntent = new Intent(Intent.ACTION_VIEW);
                          recentsIntent.setType(CallLog.Calls.CONTENT_TYPE);
                          recentsIntent.setPackage(packageName);
                          recentsIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          if (recentsIntent.resolveActivity(pm) != null) {
                              getContext().startActivity(recentsIntent);
                              call.resolve();
                              return;
                          }
                      } catch (Exception ignored) {}
                  }

                  Intent launchIntent = pm.getLaunchIntentForPackage(packageName);
                  if (launchIntent == null && isDialer) {
                      try {
                          Intent genericRecents = new Intent(Intent.ACTION_VIEW);
                          genericRecents.setType(CallLog.Calls.CONTENT_TYPE);
                          genericRecents.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          if (genericRecents.resolveActivity(pm) != null) {
                              getContext().startActivity(genericRecents);
                              call.resolve();
                              return;
                          }
                      } catch (Exception ignored) {}

                      String[] dialerCandidates = new String[] {
                          "com.google.android.dialer",
                          "com.oplus.dialer",
                          "com.oneplus.dialer",
                          "com.android.dialer"
                      };
                      for (String candidate : dialerCandidates) {
                          launchIntent = pm.getLaunchIntentForPackage(candidate);
                          if (launchIntent != null) break;
                      }
                  }
                  if (launchIntent == null) {
                      if (isDialer) {
                          launchIntent = new Intent(Intent.ACTION_DIAL);
                      } else if ("com.google.android.apps.messaging".equals(packageName)) {
                          launchIntent = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MESSAGING);
                      } else if ("com.google.android.contacts".equals(packageName)) {
                          launchIntent = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_CONTACTS);
                      }
                  }
                  if (launchIntent == null) {
                      call.reject("Unable to resolve launch intent for " + packageName);
                      return;
                  }
                  try {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(launchIntent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Failed to launch " + packageName + ": " + e.getMessage());
                  }
              }

              @PluginMethod
              public void openHomeSettings(PluginCall call) {
                  Intent intent = new Intent(Settings.ACTION_HOME_SETTINGS);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(intent);
                  call.resolve();
              }
          }
          JAVA

          cat <<'JAVA' > android/app/src/main/java/com/oxygentile/launcher/MainActivity.java
          package com.oxygentile.launcher;

          import android.graphics.Color;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LauncherBridgePlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#09090B"));
                  getWindow().setNavigationBarColor(Color.parseColor("#09090B"));
              }
          }
          JAVA

      - name: Bump versionCode & Assemble Debug APK
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text()
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          text = re.sub(r'versionCode\s+\d+', f'versionCode {run_num}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text, count=1)
          gradle_path.write_text(text)
          PY
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload OnePlus 15R Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OxygenTile-OnePlus15R-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
