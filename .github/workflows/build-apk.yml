name: Build OnePlus 15R Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Android SDK (API 34)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

      - name: Configure Home Launcher Manifest & Native Bridge
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()

          if "QUERY_ALL_PACKAGES" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n\n    <application',
                  1,
              )

          if "android.intent.category.HOME" not in manifest:
              manifest, count = re.subn(
                  r'(<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>)',
                  r'\1\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />',
                  manifest,
                  count=1,
              )
              if count == 0:
                  raise RuntimeError("Could not find LAUNCHER category in AndroidManifest.xml")

          manifest_path.write_text(manifest)
          PY

          mkdir -p android/app/src/main/java/com/oxygentile/launcher

          cat <<'JAVA' > android/app/src/main/java/com/oxygentile/launcher/LauncherBridgePlugin.java
          package com.oxygentile.launcher;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.provider.Settings;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.util.List;

          @CapacitorPlugin(name = "LauncherBridge")
          public class LauncherBridgePlugin extends Plugin {
              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  PackageManager pm = getContext().getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> resolved = pm.queryIntentActivities(mainIntent, 0);
                  JSArray apps = new JSArray();
                  String selfPackage = getContext().getPackageName();

                  for (ResolveInfo info : resolved) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(selfPackage)) continue;
                      String label = info.loadLabel(pm).toString();
                      JSObject item = new JSObject();
                      item.put("name", label);
                      item.put("packageName", pkg);
                      try {
                          Drawable drawable = info.loadIcon(pm);
                          Bitmap bitmap = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888);
                          Canvas canvas = new Canvas(bitmap);
                          drawable.setBounds(0, 0, canvas.getWidth(), canvas.getHeight());
                          drawable.draw(canvas);
                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                          bitmap.compress(Bitmap.CompressFormat.PNG, 90, out);
                          item.put("iconBase64", "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                      } catch (Exception ignored) {}
                      apps.put(item);
                  }

                  JSObject result = new JSObject();
                  result.put("apps", apps);
                  call.resolve(result);
              }

              @PluginMethod
              public void launchApp(PluginCall call) {
                  String packageName = call.getString("packageName");
                  if (packageName == null || packageName.isEmpty()) {
                      call.reject("Missing packageName");
                      return;
                  }
                  PackageManager pm = getContext().getPackageManager();
                  Intent launchIntent = pm.getLaunchIntentForPackage(packageName);
                  if (launchIntent == null) {
                      if ("com.android.dialer".equals(packageName)) {
                          launchIntent = new Intent(Intent.ACTION_DIAL);
                      } else if ("com.google.android.apps.messaging".equals(packageName)) {
                          launchIntent = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MESSAGING);
                      } else if ("com.google.android.contacts".equals(packageName)) {
                          launchIntent = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_CONTACTS);
                      }
                  }
                  if (launchIntent == null) {
                      call.reject("Unable to resolve launch intent for " + packageName);
                      return;
                  }
                  try {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(launchIntent);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Failed to launch " + packageName + ": " + e.getMessage());
                  }
              }

              @PluginMethod
              public void openHomeSettings(PluginCall call) {
                  Intent intent = new Intent(Settings.ACTION_HOME_SETTINGS);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(intent);
                  call.resolve();
              }
          }
          JAVA

          cat <<'JAVA' > android/app/src/main/java/com/oxygentile/launcher/MainActivity.java
          package com.oxygentile.launcher;

          import android.graphics.Color;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LauncherBridgePlugin.class);
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#09090B"));
                  getWindow().setNavigationBarColor(Color.parseColor("#09090B"));
              }
          }
          JAVA

      - name: Bump versionCode & Assemble Debug APK
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text()
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          text = re.sub(r'versionCode\s+\d+', f'versionCode {run_num}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text, count=1)
          gradle_path.write_text(text)
          PY
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload OnePlus 15R Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OxygenTile-OnePlus15R-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
